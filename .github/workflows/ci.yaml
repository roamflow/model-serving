name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    # Native ARM64 runner: tests run on the same architecture as the cluster.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: test
    # Only publish from main; PRs just run the tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and short SHA
        id: versioning
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.versioning.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_MLFLOW=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo (roamflow/devops)
        uses: actions/checkout@v4
        with:
          repository: roamflow/devops
          ssh-key: ${{ secrets.DEVOPS_DEPLOY_KEY }}
          path: devops-repo
          ref: main

      - name: Promote image tag to GitOps repo
        run: |
          NEW_TAG="${{ steps.versioning.outputs.tag }}"
          VALUES_FILE="devops-repo/apps/model-serving/values.yaml"
          echo "Promoting image tag to: ${NEW_TAG}"

          sed -i -E "s|tag: \".*\"|tag: \"${NEW_TAG}\"|" "$VALUES_FILE"

          cd devops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No change in image tag."
          else
            git add apps/model-serving/values.yaml
            git commit -m "chore(model-serving): bump image tag to ${NEW_TAG} [skip ci]"
            git push origin main
            echo "Successfully pushed tag ${NEW_TAG} to roamflow/devops!"
          fi

